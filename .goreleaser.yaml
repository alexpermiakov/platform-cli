# One static binary per platform on every vX.Y.Z tag, published as a GitHub
# release. No runtime for developers to install or keep in sync, and no
# package manager in the loop: you download the tarball for your platform.
version: 2

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: platform
    main: .
    binary: platform
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/alexpermiakov/platform-cli/internal/cli.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]
